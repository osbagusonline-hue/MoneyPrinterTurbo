name: Bagus Food Advertisement MP4
on:
  push:
    branches:
      - main
    paths:
      - 'assets/food_ads/**'
      - 'projects/food_ads/**'
  workflow_dispatch:
    inputs:
      bottle_path:
        description: 'Repository path to original bottle PNG/JPG'
        required: true
        default: 'assets/food_ads/bagus_bottle.png'
      meal_path:
        description: 'Repository path to nasi, ulam and fried fish PNG/JPG'
        required: true
        default: 'assets/food_ads/nasi_ulam_fried_fish.jpg'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and Malay voice generator
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install edge-tts==7.3.1
      - name: Render commercial
        env:
          BOTTLE_PATH: ${{ inputs.bottle_path || 'assets/food_ads/bagus_bottle.png' }}
          MEAL_PATH: ${{ inputs.meal_path || 'assets/food_ads/nasi_ulam_fried_fish.jpg' }}
        run: |
          python scripts/render_bagus_food_ad.py --bottle "$BOTTLE_PATH" --meal "$MEAL_PATH" --output dist/bagus_sambal_belacan_10s.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: bagus-sambal-belacan-commercial
          path: dist/bagus_sambal_belacan_10s.mp4
          if-no-files-found: error
          retention-days: 14
